# '유튜브' 탭 채널 목록 **매주 자동 점검**(보는 라디오 전달문 121의 2번).
#
# ⚠ 비밀값 없이도 돈다 — 그때는 공개 쪽만 본다.
#    이슈를 여는 데 쓰는 GITHUB_TOKEN 은 액션이 저절로 준다.
#
# ⚠ **`YT_API_KEY` 가 있으면 공식 Data API 로 확인한다**(보는 라디오
#    전달문 127). 공개 쪽은 데이터센터 IP 에서 404·500 을 주거나 엉뚱한
#    채널을 주어 **자동 점검에 쓸 수 없었다**(첫 실행 통과 0/49).
#    키 넣는 법은 README.md 의 '사장님 할 일'에 있다.
#    **키가 없으면 지금처럼 공개 쪽으로 돈다** — 아무것도 깨지지 않는다.
#
# 넣는 자리: 홈페이지 저장소의 .github/workflows/youtube-channels.yml
# 점검기 자리: tools/youtube_check/  (README.md 를 보라)

name: 유튜브 채널 매주 점검

on:
  # ⏸ 손 실행으로 API판 통과를 확인한 뒤 다시 켬(수면앱 세션).
  # schedule:
  #   # 월요일 05:00 KST = 일요일 20:00 UTC
  #   - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: youtube-channels
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⚠ 설치하는 것이 없다 — 점검기는 **표준 라이브러리만** 쓴다.
      - name: 채널 점검
        id: check
        run: |
          python tools/youtube_check/check_youtube_channels.py \
            --out "$OUT_PATH"
        env:
          # 이 저장소 규칙: _src/<앱>/static/ → docs/<앱>/ (수면앱 세션, 11/7)
          #   _src/visualradio/static/data/youtube_channels.json
          #   → https://modubox.app/visualradio/data/youtube_channels.json
          OUT_PATH: _src/visualradio/static/data/youtube_channels.json
          # ⚠ **없으면 빈 값으로 간다** — 점검기가 그때는 공개 쪽으로
          #    돈다(전달문 127). 값은 로그·이슈에 적히지 않는다.
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      # 목록이 바뀐 날에만 사이트를 다시 만든다(_src → docs). build.py 는
      # 같은 원고면 같은 결과를 내므로 docs 에서는 목록 파일만 바뀐다.
      - name: 사이트 다시 만들기(목록이 바뀐 날만)
        if: steps.check.outputs.changed == 'true'
        run: |
          pip install "markdown==3.11"
          python _src/build.py
          git status --short

      - name: 바뀐 것만 커밋
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "유튜브 채널 점검 — ${{ steps.check.outputs.summary }}"
          git push

      # 실패 횟수(state.json)만 바뀐 날에도 남겨 둔다 — 2주 규칙이
      # 다음 주에 이어지려면 그 숫자가 저장소에 있어야 한다.
      - name: 실패 횟수만 바뀌었으면 그것만 커밋
        if: steps.check.outputs.changed != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/youtube_check/state.json
          git diff --cached --quiet || git commit -m "유튜브 채널 점검 — 실패 횟수만 고침"
          git diff --quiet HEAD origin/$(git rev-parse --abbrev-ref HEAD) || git push

      - name: 알릴 것이 있으면 이슈 하나
        if: steps.check.outputs.issue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${{ steps.check.outputs.title }}`,
              body: `${{ steps.check.outputs.body }}`,
            });
