# '유튜브' 탭 **영상 목록을 공식 API 로 만들어 올린다**
# (보는 라디오 전달문 130의 1번).
#
# ⚠ **`YT_API_KEY` 가 있어야 돈다** — 없으면 아무것도 하지 않고 그대로
#    끝난다(공개 쪽으로 만들지 않는다. 그것이 믿을 수 없어 이것을
#    만들었다 — 공개 RSS 가 데이터센터 IP 에서 404·500 을 준다).
#    키 넣는 법은 README.md 의 '사장님 할 일'에 있다.
#
# ⚠ **채널 점검(주 1회)과 따로 돈다.** 이것은 **6시간마다**다.
#    쓰는 양은 한 번에 약 채널 수 + 17단위(채널 50 → ≈67) × 4 = 하루
#    ≈270(하루 한도 10,000 의 2.7%).
#
# 넣는 자리: 홈페이지 저장소의 .github/workflows/youtube-videos.yml
# 점검기 자리: tools/youtube_check/  (README.md 를 보라)

name: 유튜브 영상 목록 만들기

on:
  # 11/7 손 실행으로 첫 파일(54채널 · 영상 733개) 확인 → 켬(수면앱 세션)
  schedule:
    # 6시간마다(UTC 0·6·12·18시 = KST 9·15·21·3시)
    - cron: "10 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-videos
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⚠ 설치하는 것이 없다 — **표준 라이브러리만** 쓴다.
      - name: 영상 목록 만들기
        run: |
          python tools/youtube_check/make_youtube_videos.py \
            --channels "$CHANNELS_PATH" \
            --out      "$OUT_PATH"
        env:
          # 이 저장소 규칙: _src/<앱>/static/ → docs/<앱>/ (수면앱 세션, 11/7)
          #   → https://modubox.app/visualradio/data/youtube_videos.json
          CHANNELS_PATH: _src/visualradio/static/data/youtube_channels.json
          OUT_PATH: _src/visualradio/static/data/youtube_videos.json
          # ⚠ **없으면 아무것도 하지 않는다.** 값은 로그에 적히지 않는다.
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      # 목록이 바뀌었을 때만 사이트를 다시 만든다(_src → docs). build.py 는
      # 같은 원고면 같은 결과라 docs 에서는 영상 목록 파일만 바뀐다.
      - name: 사이트 다시 만들기(목록이 바뀐 때만)
        run: |
          if git status --porcelain _src/visualradio/static/data | grep -q .; then
            pip install "markdown==3.11"
            python _src/build.py
          fi
          git status --short

      - name: 바뀐 것만 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "유튜브 영상 목록 — $(date -u +%Y-%m-%dT%H:%MZ)"
          git diff --quiet HEAD origin/$(git rev-parse --abbrev-ref HEAD) || { git pull --rebase -q && git push; }
